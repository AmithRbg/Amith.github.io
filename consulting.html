<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulting Websites - Amith</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    color: #e2e8f0;
    padding: 2rem;
}

.container { max-width: 1200px; margin: 0 auto; }

h1 {
    text-align: center;
    margin-bottom: 3rem;
    color: #60a5fa;
}

.back-link {
    display: inline-block;
    margin-bottom: 2rem;
    color: #60a5fa;
    text-decoration: none;
    font-weight: 600;
}

.projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 2rem;
}

.project-card {
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.3s;
}

.project-card:hover {
    transform: translateY(-10px);
}

.project-header {
    font-size: 3rem;
    text-align: center;
    padding: 2rem;
    background: #3b82f6;
}

.project-content {
    padding: 2rem;
}

.button-group {
    display: flex;
    gap: 1rem;
}

.btn {
    flex: 1;
    padding: 0.8rem;
    border-radius: 8px;
    cursor: pointer;
    border: none;
}

.btn-preview {
    background: #2563eb;
    color: white;
}

.btn-buy {
    background: transparent;
    border: 1px solid #60a5fa;
    color: #60a5fa;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
}

.modal-content {
    background: #1e293b;
    margin: 10% auto;
    padding: 2rem;
    border-radius: 10px;
    max-width: 400px;
    text-align: center;
}

.watermark {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #3b82f6;
    padding: 10px;
    border-radius: 6px;
}
</style>
</head>

<body>

<div class="watermark">Demo by Amith</div>

<div class="container">

<a href="index.html" class="back-link">← Back to Portfolio</a>

<h1>Consulting Templates</h1>

<div id="projectsGrid" class="projects-grid"></div>

</div>

<!-- BUY MODAL -->
<div id="buyModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle"></h2>

        <div id="priceBox">
            <h3 id="priceText"></h3>
        </div>

        <p>Contact to buy:</p>
        <p><b>amithboss555@gmail.com</b></p>

        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>

// 🔥 PROJECT SYSTEM (EDIT HERE ONLY)
const projects = [
    {
        icon: '💼',
        title: 'Management Consulting',
        description: 'Professional consulting website',
        preview: 'https://example.com/demo1',
        price: 800
    },
    {
        icon: '📊',
        title: 'Business Strategy',
        description: 'Strategy consulting website',
        preview: 'https://example.com/demo2',
        price: null
    },
    {
        icon: '🚀',
        title: 'Digital Transformation',
        description: 'Innovation consulting site',
        preview: 'https://example.com/demo3',
        price: 1200
    }
];

// RENDER PROJECTS
const grid = document.getElementById("projectsGrid");

projects.forEach(p => {
    grid.innerHTML += `
    <div class="project-card">
        <div class="project-header">${p.icon}</div>
        <div class="project-content">
            <h3>${p.title}</h3>
            <p>${p.description}</p>

            ${p.price ? `<p>₹${p.price}</p>` : ''}

            <div class="button-group">
                <button class="btn btn-preview" onclick="openPreview('${p.preview}')">Preview</button>
                <button class="btn btn-buy" onclick="showBuy('${p.title}', ${p.price})">Buy</button>
            </div>
        </div>
    </div>
    `;
});

// PREVIEW
function openPreview(url) {
    window.open(url, '_blank');
}

// BUY MODAL
const modal = document.getElementById("buyModal");

function showBuy(name, price) {
    document.getElementById("modalTitle").innerText = name;

    const priceBox = document.getElementById("priceBox");
    const priceText = document.getElementById("priceText");

    if (price) {
        priceBox.style.display = "block";
        priceText.innerText = "₹" + price;
    } else {
        priceBox.style.display = "none";
    }

    modal.style.display = "block";
}

function closeModal() {
    modal.style.display = "none";
}

// CLOSE ON OUTSIDE CLICK
window.onclick = (e) => {
    if (e.target == modal) closeModal();
}

// DISABLE RIGHT CLICK
document.addEventListener("contextmenu", e => e.preventDefault());

</script>

</body>
</html>
