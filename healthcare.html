<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Websites - Amith</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); color: #e2e8f0; padding: 2rem; }
        .watermark { position: fixed; bottom: 20px; right: 20px; background: rgba(59, 130, 246, 0.9); padding: 1rem 2rem; border-radius: 8px; font-weight: 700; z-index: 1000; pointer-events: none; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 3rem; color: #60a5fa; font-size: 2.5rem; }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
        .project-card { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 12px; overflow: hidden; transition: all 0.3s; }
        .project-card:hover { transform: translateY(-10px); box-shadow: 0 20px 50px rgba(59, 130, 246, 0.2); }
        .project-header { background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%); padding: 2rem; text-align: center; font-size: 3rem; }
        .project-content { padding: 2rem; }
        .project-content h3 { font-size: 1.5rem; margin-bottom: 1rem; color: #f1f5f9; }
        .project-content p { color: #cbd5e1; margin-bottom: 1.5rem; line-height: 1.6; }
        .button-group { display: flex; gap: 1rem; }
        .btn { flex: 1; padding: 0.8rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-align: center; }
        .btn-preview { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; }
        .btn-preview:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }
        .btn-buy { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #60a5fa; }
        .btn-buy:hover { background: rgba(59, 130, 246, 0.3); transform: translateY(-2px); }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); }
        .modal-content { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); margin: 10% auto; padding: 2rem; border-radius: 12px; max-width: 500px; text-align: center; }
        .close { float: right; font-size: 2rem; cursor: pointer; }
        .price-box { margin: 1rem 0; }
        .price { font-size: 2rem; color: #60a5fa; }

        .back-link { display: inline-block; margin-bottom: 2rem; color: #60a5fa; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="watermark">Demo by Amith</div>

<div class="container">

    <!-- FIXED BACK BUTTON -->
    <a href="index.html" class="back-link">← Back to Portfolio</a>

    <h1>Healthcare Website Templates</h1>

    <div class="projects-grid" id="projectsGrid"></div>

</div>

<!-- BUY MODAL -->
<div id="buyModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeBuyModal()">&times;</span>
        <h2 id="modalTitle"></h2>

        <!-- PRICE (DYNAMIC) -->
        <div id="priceBox" class="price-box" style="display:none;">
            <div class="price" id="modalPrice"></div>
        </div>

        <p>Contact to buy:</p>
        <p><b>amithboss555@gmail.com</b></p>
    </div>
</div>

<script>
/* =========================
   EASY PROJECT SYSTEM
   ========================= */

const projects = [
    {
        icon: '🏥',
        title: 'General Hospital',
        description: 'Hospital website',
        preview: 'https://example.com/demo1',
        price: 800
    },
    {
        icon: '👨‍⚕️',
        title: 'Clinic & Diagnostics',
        description: 'Clinic website',
        preview: 'https://example.com/demo2'
        // no price → hidden
    },
    {
        icon: '🦷',
        title: 'Dental Practice',
        description: 'Dental site',
        preview: 'https://example.com/demo3',
        price: 500
    }
];

/* =========================
   RENDER PROJECTS
   ========================= */

const grid = document.getElementById('projectsGrid');

projects.forEach(p => {
    grid.innerHTML += `
        <div class="project-card">
            <div class="project-header">${p.icon}</div>
            <div class="project-content">
                <h3>${p.title}</h3>
                <p>${p.description}</p>

                <div class="button-group">
                    <button class="btn btn-preview" onclick="openPreview('${p.preview}')">Preview</button>
                    <button class="btn btn-buy" onclick="showBuyModal('${p.title}', ${p.price || null})">Buy</button>
                </div>
            </div>
        </div>
    `;
});

/* =========================
   FUNCTIONS
   ========================= */

function openPreview(url) {
    window.open(url, '_blank');
}

const modal = document.getElementById('buyModal');

function showBuyModal(title, price) {
    document.getElementById('modalTitle').innerText = title;

    if (price) {
        document.getElementById('priceBox').style.display = 'block';
        document.getElementById('modalPrice').innerText = "₹" + price;
    } else {
        document.getElementById('priceBox').style.display = 'none';
    }

    modal.style.display = 'block';
}

function closeBuyModal() {
    modal.style.display = 'none';
}

window.onclick = function(e) {
    if (e.target == modal) closeBuyModal();
};

/* =========================
   PROTECTION
   ========================= */

document.addEventListener('contextmenu', e => e.preventDefault());

</script>

</body>
</html>
